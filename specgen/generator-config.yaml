# Controls the spec-to-tools generation. Every operation in spec/openapi.yaml
# becomes a tool unless excluded here; the parity test enforces exactly that.

# The generator rejects exclusions whose operationId is absent from the spec.
# replacedBy identifies the curated replacement in src/specgen/tools/; once
# the server is wired, tests/specgen-gates.test.ts checks replacement registration.
exclude:
  listEndpoints:
    replacedBy: list-endpoints
    reason: trimmed, paginated output — full endpoint objects carry env maps
      and requestUrls (six derivable URLs per endpoint) that dominate the
      payload and blow up LLM context on accounts with many endpoints
  listTemplates:
    replacedBy: list-templates
    reason: trimmed output — full template objects blow up LLM context
  getPodLogs:
    replacedBy: stream-pod-logs
    reason: text/event-stream, held open to tail live output — the generated
      JSON dispatch cannot consume it
  getWorkerLogs:
    replacedBy: stream-worker-logs
    reason: text/event-stream, held open to tail live output — the generated
      JSON dispatch cannot consume it

# operationId -> tool name overrides; default is the kebab-cased operationId.
rename: {}

# operationId -> annotation overrides, merged over the hints derived from the
# HTTP method. Use for operations whose method understates what they do. The
# generator rejects keys whose operationId is absent from the spec.
annotations:
  # POST, but action terminate deletes the pod (equivalent to deletePod). A
  # host lists tools before it sees the argument, so the whole tool is marked.
  podAction:
    destructiveHint: true
  # PUT that replaces the whole key set, removing every key not in the request.
  updateSshKeys:
    destructiveHint: true

# Field descriptions are opt-in. The generator drops every schema-field and
# parameter description from the spec and serves only the ones below: each
# tools/list carries every schema, and most spec prose restates the field
# name or the API docs. Keep an entry only where the model would otherwise
# make a wrong call (wrong id kind, wrong format, a silent no-op, lost data),
# in one line, naming tools rather than HTTP routes. Types, enums, defaults
# and bounds stay in the schema either way. The generator rejects keys that
# match nothing.
#
# `Component` or `Component.field.sub`; nesting looks through allOf/anyOf/
# oneOf and array items. A $ref'd field is keyed by its target component.
fieldDescriptions:
  BaseContainerConfig.args: >-
    Container command as one string (treated as CMD), or
    {"entrypoint":[...],"cmd":[...]}.
  BaseContainerConfig.disk: Container disk in GB, wiped on restart.
  BaseContainerConfig.ports: Exposed ports as port/protocol, e.g. 8888/http or 22/tcp.
  ContainerConfig.registry: Registry credential id for a private image (list-registries).
  Mounts: At most one of persistent or network.
  TemplateMounts: Persistent only; network is rejected.
  PersistentMount: Host-local storage, lost on host failure. Not allowed on CPU pods.
  PersistentMount.size: GB, minimum 10.
  NetworkMount.volumeId: Network volume id; must be in the pod's data center.
  BaseGpuConfig.id: GPU type id from list-gpu-types, e.g. "NVIDIA GeForce RTX 4090".
  BaseCpuConfig.id: CPU flavor id from list-cpu-types.
  BaseCpuConfig.vcpuCount: Power of two, valid for the flavor.
  CreateGpuConfig.allowedCudaVersions: &cudaSet >-
    Exact CUDA versions as major.minor. Exclusive with minCudaVersion.
  CreateGpuConfig.minCudaVersion: &cudaFloor >-
    CUDA floor as major.minor, compared numerically (12.11 > 12.2). Exclusive
    with allowedCudaVersions.
  CreateEndpointGpuConfig.allowedCudaVersions: *cudaSet
  CreateEndpointGpuConfig.minCudaVersion: *cudaFloor
  UpdateEndpointGpuConfig.allowedCudaVersions: >-
    Exact CUDA versions as major.minor; [] clears. Exclusive with
    minCudaVersion.
  UpdateEndpointGpuConfig.minCudaVersion: >-
    CUDA floor as major.minor; "" clears. Exclusive with allowedCudaVersions.
  BaseEndpointGpuConfig.pools: >-
    Serverless pool ids from list-gpu-types `pool` (e.g. ADA_24), not GPU type
    ids.
  BaseEndpointGpuConfig.excludedTypes: >-
    GPU type ids to subtract from pools. On update, sending pools without this
    clears it.
  EndpointType: >-
    QUEUE runs jobs through the queue. LOAD_BALANCER sends HTTP straight to
    workers (env PORT, PORT_HEALTH, HEALTH_CHECK_PATH).
  EndpointScaling: >-
    QUEUE_DELAY (QUEUE endpoints only) or REQUEST_COUNT (required for
    LOAD_BALANCER).
  EndpointWorkers.idleTimeout: >-
    Seconds before idle workers scale down. Rejected for a QUEUE endpoint
    scaling on REQUEST_COUNT.
  CreatePodRequest: Exactly one of gpu or cpu. image is required unless templateId is set.
  CreatePodRequest.templateId: &templateCreate >-
    Template id to start from. Body fields override it; env merges per key.
  CreateEndpointRequest.templateId: *templateCreate
  UpdatePodRequest.templateId: &templateUpdate >-
    Applies a template's container settings once; the merged env replaces the
    current env.
  UpdateEndpointRequest.templateId: *templateUpdate
  CreateClusterRequest.templateId: >-
    Pod template for every member pod; the only private-image path. Exclusive
    with inline container fields.
  CreatePodRequest.startSsh: &startSsh >-
    Installs your registered SSH keys (update-ssh-keys); does nothing if none
    are registered.
  CreateTemplateRequest.startSsh: *startSsh
  CreateClusterRequest.startSsh: *startSsh
  CreatePodRequest.startJupyter: &startJupyter Starts JupyterLab; expose 8888/http to reach it.
  CreateTemplateRequest.startJupyter: *startJupyter
  CreatePodRequest.globalNetworking: >-
    Private IP across data centers. Needs an NVIDIA GPU and an eligible data
    center (list-data-centers globalNetwork).
  UpdatePodRequest.globalNetworking: Takes effect on the next start, not live.
  UpdatePodRequest.locked: Locked pods cannot be stopped or reset.
  ClusterCompute.gpuTypeId: GPU type id from list-gpu-types.
  CreateTemplateRequest.allowedCudaVersions: Exact CUDA versions as major.minor.
  UpdateTemplateRequest.allowedCudaVersions: Exact CUDA versions as major.minor; [] clears.
  CreateNetworkVolumeRequest.size: GB.
  CreateNetworkVolumeRequest.type: Storage tier; immutable after creation.
  UpdateNetworkVolumeRequest.size: GB; cannot be reduced.
  UpdateSshKeysRequest.keys: >-
    The complete key set, replacing all registered keys; [] removes them all.
    Each entry is an authorized_keys line.
  CreateSecretRequest.name: >-
    Referenced from env as {{ RUNPOD_SECRET_<name> }}. Immutable; may not
    start with RUNPOD.
  CreateSecretRequest.value: Write-only; never returned.

parameterDescriptions:
  product: Required with include=AVAILABILITY, rejected without it.
  count: Needs include=AVAILABILITY.
  cloud: Needs include=AVAILABILITY.
  vcpuCount: Power of two. Needs include=AVAILABILITY.
  countryCodes: Uppercase ISO country codes, e.g. FR,DE. Needs include=AVAILABILITY.
  cudaVersions: Exact major.minor versions. Needs include=AVAILABILITY.
  minCudaVersion: CUDA floor, e.g. 12 or 12.1. Needs include=AVAILABILITY.
  cursor: The previous response's pagination.nextCursor.
  startTime: RFC 3339. Defaults to 30 days ago.
  endTime: RFC 3339, exclusive. Defaults to now.
  lastN: Last N buckets ending now. Exclusive with startTime/endTime.
  buildId: From list-endpoint-builds.

# operationId -> description overrides; default is the spec summary+description.
# The mutation-tool overrides carry the critical gotchas inline so the
# BARE-CLIENT path (no skills installed) still sees them at tool-choice time.
descriptions:
  listServerlessBilling: >-
    Get serverless billing history, split into time buckets. SIZE WARNING: with
    defaults this emits one record per endpoint PER BUCKET — on an account with
    many endpoints the response overflows the tool-result limit and becomes
    unusable. Always pass lastN: 1 (or a bucketSize spanning the whole window)
    for one record per endpoint, and serverlessId when you need one endpoint.
    Distinct from pod billing, which covers standalone pods.
  createEndpoint: >-
    Create a serverless endpoint. BILLABLE: state the worker's hourly price
    (from the catalog tools) before creating. Worker hardware is one of two
    choices: the gpu object (gpu.pools takes serverless pool ids from the
    catalog, e.g. ADA_24, never display names; gpu.count sets GPUs per worker)
    or the cpu array of CPU flavor configurations for a CPU endpoint. type and
    scaling are required and fix the request-routing model. Workers cold-start
    on the first job: expect minutes, poll with get-job-status wait.
  updateEndpoint: >-
    Partially update a serverless endpoint (PATCH): only fields present in the
    body change, omitted ones are untouched, with one exception. DESTRUCTIVE
    GOTCHA: gpu.pools and gpu.excludedTypes are a single selection, so sending
    pools without excludedTypes clears any exclusions pinned elsewhere (the
    console or set-endpoint-gpus) — read the endpoint first with get-endpoint
    and resend excludedTypes if you still want them. An exclusion naming a type
    outside pools returns 400. A CUDA-only or count-only change does not need
    pools at all, so omit it unless you mean to replace the selection. Mutable
    fields: name, gpu, cpu, workers (min/max/idleTimeout), scaling (type plus
    queueDelay or requestCount), dataCenterIds, networkVolumes, timeout,
    flashboot, and the container settings (image, args, disk, ports, env,
    registry). cpu completely replaces a CPU endpoint's flavor selection.
    Compute family is immutable: gpu on a CPU endpoint, cpu on a GPU one, or
    both, returns 400.
    Effect timing differs by field — workers/scaling/timeout reach the
    autoscaler promptly, while container changes (image, env) cut a new release
    that rolls out as workers cycle, so in-flight workers keep the previous
    version. Track rollout with list-endpoint-releases.
  createPod: >-
    Rent a GPU/CPU pod. BILLABLE from creation until stop/terminate: state the
    hourly price before creating. GPU selection is the gpu object: gpu.id takes
    a catalog GPU type id (e.g. "NVIDIA GeForce RTX 4090"), verified via
    list-gpu-types, and gpu.count sets the GPU count; cloud/data-center choice
    constrains stock.
  deleteEndpoint: >-
    Delete a serverless endpoint permanently and immediately. Verify the id
    belongs to the intended endpoint (get-endpoint) before deleting; delete
    only endpoints your own tool calls created in this conversation, or the
    one the user asked you to delete by id — a name found by listing is not
    attribution.
  deleteTemplate: >-
    Delete a template permanently. Verify with get-template first; a template
    referenced by a live endpoint should not be deleted.
  deletePod: >-
    Terminate a pod permanently — its container disk is lost. Distinguish from
    stopping (pod-action stop) which releases the GPU but keeps volume data.
    Verify the id with get-pod first; terminate only pods your own tool calls
    created in this conversation, or the one the user asked you to terminate
    by id — a name found by listing is not attribution.
  createCluster: >-
    Create an instant cluster (multiple pods with high-speed interconnect).
    BILLABLE from creation for every pod in the cluster: it rents
    compute.podCount identical pods at once, each with compute.gpuCountPerPod
    GPUs of compute.gpuTypeId — state the hourly price for the total GPU count
    (podCount * gpuCountPerPod, priced from the catalog tools) and create only
    after the user's explicit go on that quoted shape and total hourly price.
    Verify GPU stock first via the catalog tools. The compute shape and type
    are fixed at creation; only the name can be changed later. The container
    configuration applies to every pod, and templateId is the only
    private-image path — a bare registry property is rejected. Delete with
    delete-cluster when finished.
  deleteCluster: >-
    Delete a cluster permanently: it terminates every member pod. Verify the id
    with get-cluster, and list-cluster-pods for what the delete takes down,
    before deleting; delete only clusters your own tool calls created in this
    conversation, or the one the user asked you to delete by id — a name found
    by listing is not attribution.
  deleteSecret: >-
    Delete a secret permanently. Environment variables referencing its name
    ({{ RUNPOD_SECRET_<name> }}) stop resolving at the next pod or worker boot;
    running instances keep the value they started with. Verify the id with
    get-secret first; delete only secrets your own tool calls created in this
    conversation, or the one the user asked you to delete by id — a name found
    by listing is not attribution.
